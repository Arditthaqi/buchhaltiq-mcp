[project]
name = "buchhaltiq-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the BuchhaltIQ accounting product. Demonstrates the SaaS-makes-its-own-product-MCP-ready pattern with both fixture-based demo mode and production mode."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Ardit Thaqi", email = "ardit@bornsoftware.de" },
]
license = { text = "MIT" }
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "buchhaltiq",
    "accounting",
    "german-smb",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
buchhaltiq-mcp = "buchhaltiq_mcp.__main__:main"

[project.urls]
Homepage = "https://buchhaltiq.de"
Repository = "https://github.com/Arditthaqi/buchhaltiq-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buchhaltiq_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "buchhaltiq_mcp/_fixtures"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "RUF",
    "ASYNC",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
